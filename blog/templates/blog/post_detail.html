{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>
<p class="text-muted">{{ post.created_at|date:"M d, Y" }}</p>
<p>{{ post.content }}</p>

{% if post.category %}
  <span class="badge bg-secondary">{{ post.category.name }}</span>
{% endif %}
{% endblock %}
{% if post.cover_image %}
    <img src="{{ post.cover_image.url }}" class="img-fluid rounded mb-3" alt="{{ post.title }}">
{% endif %}
